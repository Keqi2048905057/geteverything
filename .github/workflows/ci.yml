name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ruff + pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂掉不要连带取消另一个 —— 否则「Windows 特有缺陷」会被 Linux 的
      # 失败掩盖成「整个 job 失败」，看不到真正的原因（见 CODEBASE_MAP §9.10 第 3 条：
      # 本地 Windows 全绿、CI 上 POSIX 进程组误杀调用方的那个缺陷）。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: get_everything_framework

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            get_everything_framework/requirement.txt
            get_everything_framework/requirement-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt -r requirement-dev.txt

      - name: 静态检查
        run: ruff check .

      - name: 运行测试
        run: pytest -q

      - name: 环境自检冒烟
        # 这一步不是为了「环境必须是好的」—— CI runner 本来就没有 .env、也没有那 17 个
        # Go 工具，warn（退出码 1）是预期结果。它要证明的是：自检脚本在一台**干净机器**上
        # 也能跑完并给出可读结论，而不是抛异常或需要人先配好环境才能用。
        # 因此只把「阻塞项」（退出码 2）当失败。
        run: python -c "import subprocess,sys; r=subprocess.run([sys.executable,'scripts/check_env.py']); sys.exit(0 if r.returncode <= 1 else 1)"

      - name: 类型检查
        # 只在 ubuntu 上跑一次：mypy 结果与平台无关，Windows 再跑一遍纯属浪费配额。
        # 范围与本地验收命令一致（方案第 17 节）；agent/providers/* 不在范围内，
        # 原因见 docs/CODEBASE_MAP.md §9.13 末。
        if: matrix.os == 'ubuntu-latest'
        run: mypy app.py core api jobs storage.py modules scripts
