name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: get_everything_framework

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            get_everything_framework/requirement.txt
            get_everything_framework/requirement-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt -r requirement-dev.txt

      - name: 静态检查
        run: ruff check .

      - name: 运行测试
        run: pytest -q
